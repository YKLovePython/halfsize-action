name: diagnose

on:
  push:
    branches: [diagnose]
  workflow_dispatch:

jobs:
  macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Is the first launch of the bundled binary slow?
        shell: bash
        run: |
          npm install -g halfsize@0.1.9
          GR=$(npm root -g)
          FF="$GR/halfsize/node_modules/ffmpeg-static/ffmpeg"
          FP="$GR/halfsize/node_modules/ffprobe-static/bin/darwin/arm64/ffprobe"
          CLEAN=$(node -e 'console.log(process.env.PATH.split(":").filter(d=>!d.includes("ffmpeg-static")&&!d.includes("ffprobe-static")).join(":"))')

          echo '--- cold launch: ffmpeg ---'
          start=$(node -p 'Date.now()')
          env -u HALFSIZE_FFMPEG -u HALFSIZE_FFPROBE PATH="$CLEAN" "$FF" -version > /dev/null
          echo "cold ffmpeg ms=$(( $(node -p 'Date.now()') - start ))"

          echo '--- cold launch: ffprobe ---'
          start=$(node -p 'Date.now()')
          env -u HALFSIZE_FFMPEG -u HALFSIZE_FFPROBE PATH="$CLEAN" "$FP" -version > /dev/null
          echo "cold ffprobe ms=$(( $(node -p 'Date.now()') - start ))"

          echo '--- doctor after warm-up ---'
          env -u HALFSIZE_FFMPEG -u HALFSIZE_FFPROBE PATH="$CLEAN" halfsize --doctor
          echo "doctor exit=$?"
