name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compress:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The five-second clip has to exist before the action runs, so fetch the same
      # static build halfsize bundles. Pointing the action at it explicitly keeps the
      # test independent of what each runner image happens to put on PATH.
      - name: Provide FFmpeg
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund ffmpeg-static@5.3.0 ffprobe-static@3.1.0
          node -e "const p=require('path');const f=x=>p.resolve(x).split(p.sep).join('/');console.log('HALFSIZE_FFMPEG='+f(require('ffmpeg-static')));console.log('HALFSIZE_FFPROBE='+f(require('ffprobe-static').path));" >> "$GITHUB_ENV"

      - name: Make a test clip
        shell: bash
        run: |
          mkdir -p videos
          "$HALFSIZE_FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x360:rate=30 \
            -f lavfi -i sine=frequency=440 \
            -t 5 -c:v libx264 -b:v 3M -c:a aac videos/clip.mp4
          ls -l videos

      # Run the published CLI once outside the action, with a hard time bound
      # where the platform has `timeout`. A hung install or encoder then shows
      # up as a failed step with timings instead of stalling the whole job.
      - name: Time a direct CLI run
        shell: bash
        run: |
          start=$SECONDS
          npm install -g halfsize@0.1.10
          echo "install_seconds=$((SECONDS - start))"
          halfsize --version
          start=$SECONDS
          if command -v timeout > /dev/null 2>&1; then
            timeout 300 halfsize videos/clip.mp4 --to 1mb --out smoke.mp4 || true
          else
            halfsize videos/clip.mp4 --to 1mb --out smoke.mp4 || true
          fi
          echo "encode_seconds=$((SECONDS - start))"
          ls -l smoke.mp4 || true

      - uses: ./
        with:
          files: videos/clip.mp4
          args: --to 1mb

      - name: Assert the output exists and is smaller than the source
        shell: bash
        run: |
          ls -l videos
          test -f videos/clip.1mb.mp4
          source_size=$(wc -c < videos/clip.mp4 | tr -d ' ')
          output_size=$(wc -c < videos/clip.1mb.mp4 | tr -d ' ')
          echo "source=$source_size output=$output_size"
          test "$output_size" -lt "$source_size"
